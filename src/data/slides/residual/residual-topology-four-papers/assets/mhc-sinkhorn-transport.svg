<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">mHC Sinkhorn transport</title>
  <desc id="desc">自由 logits 经指数和二十次交替行列归一化后成为近似双随机 transport，所有文字均保留在对应框内，主 branch 保持 d 到 d。</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1258ff"/>
    </marker>
    <style>
      .t{font-family:Inter,"PingFang SC",sans-serif;fill:#171816}
      .m{font-family:"SFMono-Regular",Consolas,monospace;fill:#565a55}
      .free{fill:#f7e6e1;stroke:#b44c35;stroke-width:3}
      .proc{fill:#e6edff;stroke:#1258ff;stroke-width:3}
      .stable{fill:#e5f0e7;stroke:#3f7750;stroke-width:3}
      .branch{fill:#fff3cf;stroke:#9a7611;stroke-width:3}
      .a{stroke:#1258ff;stroke-width:4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#fffdf8"/>

  <rect x="35" y="170" width="190" height="125" class="free"/>
  <text x="130" y="218" class="t" font-size="26" font-weight="700" text-anchor="middle">free logits</text>
  <text x="130" y="258" class="m" font-size="19" text-anchor="middle">per token</text>

  <path d="M225 232H295" class="a"/>
  <rect x="295" y="170" width="160" height="125" class="proc"/>
  <text x="375" y="220" class="t" font-size="28" font-weight="700" text-anchor="middle">exp</text>
  <text x="375" y="258" class="m" font-size="19" text-anchor="middle">positive</text>

  <path d="M455 232H525" class="a"/>
  <rect x="525" y="140" width="270" height="185" class="proc"/>
  <text x="660" y="193" class="t" font-size="26" font-weight="700" text-anchor="middle">20-step Sinkhorn</text>
  <text x="660" y="238" class="m" font-size="16" text-anchor="middle">column norm ↔ row norm</text>
  <text x="660" y="279" class="m" font-size="16" text-anchor="middle">finite differentiable map</text>

  <path d="M795 232H865" class="a"/>
  <rect x="865" y="140" width="300" height="185" class="stable"/>
  <text x="1015" y="187" class="t" font-size="25" font-weight="700" text-anchor="middle">constrained transport</text>
  <text x="1015" y="225" class="m" font-size="21" text-anchor="middle">Hres ≈ Bn</text>
  <text x="1015" y="263" class="m" font-size="18" text-anchor="middle">row sums ≈ 1</text>
  <text x="1015" y="296" class="m" font-size="18" text-anchor="middle">column sums ≈ 1</text>

  <path d="M660 325V380" stroke="#777" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="355" y="380" width="610" height="100" class="branch"/>
  <text x="660" y="421" class="t" font-size="25" font-weight="700" text-anchor="middle">main branch unchanged</text>
  <text x="660" y="456" class="m" font-size="20" text-anchor="middle">Attention / MLP · d → d</text>
</svg>
