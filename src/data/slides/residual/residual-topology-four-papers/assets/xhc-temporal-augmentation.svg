<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">xHC temporal feature augmentation</title>
  <desc id="desc">一次 MLP 输出形成原始分量和三个因果 depthwise convolution 分量，文字分行放置且不会超出边框。</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1258ff"/>
    </marker>
    <style>
      .t{font-family:Inter,"PingFang SC",sans-serif;fill:#171816}
      .m{font-family:"SFMono-Regular",Consolas,monospace;fill:#565a55}
      .branch{fill:#e5f0e7;stroke:#3f7750;stroke-width:3}
      .route{fill:#e6edff;stroke:#1258ff;stroke-width:3}
      .out{fill:#fff3cf;stroke:#9a7611;stroke-width:3}
      .a{fill:none;stroke:#1258ff;stroke-width:3;marker-end:url(#a)}
      .spine{fill:none;stroke:#1258ff;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#fffdf8"/>

  <rect x="35" y="190" width="205" height="130" class="branch"/>
  <text x="137" y="240" class="t" font-size="28" font-weight="700" text-anchor="middle">one MLP</text>
  <text x="137" y="282" class="m" font-size="21" text-anchor="middle">output y</text>

  <path d="M240 255H295" class="spine"/>
  <path d="M295 102V410" class="spine"/>
  <path d="M295 102H340" class="a"/>
  <path d="M295 205H340" class="a"/>
  <path d="M295 308H340" class="a"/>
  <path d="M295 410H340" class="a"/>

  <rect x="340" y="65" width="365" height="75" class="route"/>
  <text x="365" y="96" class="t" font-size="21" font-weight="700">component 0</text>
  <text x="365" y="123" class="m" font-size="16">original output y</text>

  <rect x="340" y="168" width="365" height="75" class="route"/>
  <text x="365" y="199" class="t" font-size="21" font-weight="700">component 1</text>
  <text x="365" y="226" class="m" font-size="16">causal depthwise conv · kernel 4</text>

  <rect x="340" y="271" width="365" height="75" class="route"/>
  <text x="365" y="302" class="t" font-size="21" font-weight="700">component 2</text>
  <text x="365" y="329" class="m" font-size="16">causal depthwise conv · kernel 8</text>

  <rect x="340" y="373" width="365" height="75" class="route"/>
  <text x="365" y="404" class="t" font-size="21" font-weight="700">component 3</text>
  <text x="365" y="431" class="m" font-size="16">causal depthwise conv · kernel 12</text>

  <path d="M705 102L930 205" class="a"/>
  <path d="M705 205L930 235" class="a"/>
  <path d="M705 308L930 265" class="a"/>
  <path d="M705 410L930 295" class="a"/>

  <rect x="930" y="160" width="235" height="180" class="out"/>
  <text x="1047" y="207" class="t" font-size="27" font-weight="700" text-anchor="middle">Kᵣ = 4</text>
  <text x="1047" y="246" class="t" font-size="21" text-anchor="middle">write candidates</text>
  <text x="1047" y="282" class="m" font-size="17" text-anchor="middle">one shared MLP</text>
  <text x="1047" y="313" class="m" font-size="17" text-anchor="middle">+24C parameters</text>

  <text x="600" y="495" class="m" font-size="17" text-anchor="middle">richer linear components · not four MLP evaluations</text>
</svg>
