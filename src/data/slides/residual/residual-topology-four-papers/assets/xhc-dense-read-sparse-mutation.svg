<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">xHC dense read and sparse mutation</title>
  <desc id="desc">十六条 persistent streams 全部参与 dense read，固定两条加 routed Top-2 构成四条 active streams，只有 active streams 更新。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1258ff"/></marker><style>.t{font-family:Inter,"PingFang SC",sans-serif;fill:#171816}.m{font-family:"SFMono-Regular",Consolas,monospace;fill:#565a55}.inactive{fill:#f5f3ed;stroke:#aaa99f;stroke-width:2}.fixed{fill:#e6edff;stroke:#1258ff;stroke-width:3}.routed{fill:#ffe0cc;stroke:#ef6c36;stroke-width:3}.read{fill:#e5f0e7;stroke:#3f7750;stroke-width:3}.a{fill:none;stroke:#1258ff;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="560" fill="#fffdf8"/>
  <text x="55" y="58" class="m" font-size="22">PERSISTENT STATE · N = 16</text>
  <g transform="translate(55 95)">
    <rect x="0" y="0" width="50" height="310" class="fixed"/><rect x="60" y="0" width="50" height="310" class="fixed"/>
    <rect x="120" y="0" width="50" height="310" class="inactive"/><rect x="180" y="0" width="50" height="310" class="inactive"/><rect x="240" y="0" width="50" height="310" class="routed"/><rect x="300" y="0" width="50" height="310" class="inactive"/><rect x="360" y="0" width="50" height="310" class="inactive"/><rect x="420" y="0" width="50" height="310" class="inactive"/><rect x="480" y="0" width="50" height="310" class="inactive"/><rect x="540" y="0" width="50" height="310" class="inactive"/><rect x="600" y="0" width="50" height="310" class="routed"/><rect x="660" y="0" width="50" height="310" class="inactive"/><rect x="720" y="0" width="50" height="310" class="inactive"/><rect x="780" y="0" width="50" height="310" class="inactive"/><rect x="840" y="0" width="50" height="310" class="inactive"/><rect x="900" y="0" width="50" height="310" class="inactive"/>
    <g class="m" font-size="16" text-anchor="middle"><text x="25" y="340">F1</text><text x="85" y="340">F2</text><text x="145" y="340">3</text><text x="205" y="340">4</text><text x="265" y="340">R1</text><text x="325" y="340">6</text><text x="385" y="340">7</text><text x="445" y="340">8</text><text x="505" y="340">9</text><text x="565" y="340">10</text><text x="625" y="340">R2</text><text x="685" y="340">12</text><text x="745" y="340">13</text><text x="805" y="340">14</text><text x="865" y="340">15</text><text x="925" y="340">16</text></g>
  </g>
  <path d="M530 120C600 40 900 35 1010 120" class="a"/>
  <rect x="990" y="90" width="175" height="110" class="read"/><text x="1077" y="132" class="t" font-size="24" font-weight="700" text-anchor="middle">dense read</text><text x="1077" y="170" class="m" font-size="18" text-anchor="middle">all N streams</text>
  <rect x="830" y="435" width="335" height="78" class="routed"/><text x="997" y="468" class="t" font-size="23" font-weight="700" text-anchor="middle">mutate only k = 4</text><text x="997" y="497" class="m" font-size="17" text-anchor="middle">fixed-2 + routed Top-2</text>
  <text x="300" y="497" class="t" font-size="23" text-anchor="middle">inactive N−k streams：exact carry</text>
</svg>
