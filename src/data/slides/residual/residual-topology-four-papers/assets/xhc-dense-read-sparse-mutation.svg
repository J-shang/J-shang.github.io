<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">xHC dense read and sparse mutation</title>
  <desc id="desc">十六条 persistent streams 全部参与 dense read，固定两条与 routed Top-2 构成四条 active streams，active update 与 inactive exact carry 分成两条不重叠的视觉路径。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1258ff"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ef6c36"/>
    </marker>
    <style>
      .t{font-family:Inter,"PingFang SC",sans-serif;fill:#171816}
      .m{font-family:"SFMono-Regular",Consolas,monospace;fill:#565a55}
      .panel{fill:#fffdf8;stroke:#aaa99f;stroke-width:2}
      .inactive{fill:#f5f3ed;stroke:#aaa99f;stroke-width:2}
      .fixed{fill:#e6edff;stroke:#1258ff;stroke-width:3}
      .routed{fill:#ffe0cc;stroke:#ef6c36;stroke-width:3}
      .read{fill:#e5f0e7;stroke:#3f7750;stroke-width:3}
      .update{fill:#f1eaff;stroke:#7157b8;stroke-width:3}
      .next{fill:#fff3cf;stroke:#9a7611;stroke-width:3}
      .read-arrow{fill:none;stroke:#1258ff;stroke-width:4;marker-end:url(#blue-arrow)}
      .mutate-arrow{fill:none;stroke:#ef6c36;stroke-width:4;marker-end:url(#orange-arrow)}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#fffdf8"/>

  <text x="35" y="45" class="m" font-size="21">PERSISTENT STATE · N = 16</text>
  <rect x="35" y="70" width="735" height="170" class="panel"/>
  <g transform="translate(62 105)">
    <rect x="0" y="0" width="34" height="78" class="fixed"/>
    <rect x="42" y="0" width="34" height="78" class="fixed"/>
    <rect x="84" y="0" width="34" height="78" class="inactive"/>
    <rect x="126" y="0" width="34" height="78" class="inactive"/>
    <rect x="168" y="0" width="34" height="78" class="routed"/>
    <rect x="210" y="0" width="34" height="78" class="inactive"/>
    <rect x="252" y="0" width="34" height="78" class="inactive"/>
    <rect x="294" y="0" width="34" height="78" class="inactive"/>
    <rect x="336" y="0" width="34" height="78" class="inactive"/>
    <rect x="378" y="0" width="34" height="78" class="inactive"/>
    <rect x="420" y="0" width="34" height="78" class="routed"/>
    <rect x="462" y="0" width="34" height="78" class="inactive"/>
    <rect x="504" y="0" width="34" height="78" class="inactive"/>
    <rect x="546" y="0" width="34" height="78" class="inactive"/>
    <rect x="588" y="0" width="34" height="78" class="inactive"/>
    <rect x="630" y="0" width="34" height="78" class="inactive"/>
    <g class="m" font-size="13" text-anchor="middle">
      <text x="17" y="101">F1</text><text x="59" y="101">F2</text><text x="101" y="101">3</text><text x="143" y="101">4</text>
      <text x="185" y="101">R1</text><text x="227" y="101">6</text><text x="269" y="101">7</text><text x="311" y="101">8</text>
      <text x="353" y="101">9</text><text x="395" y="101">10</text><text x="437" y="101">R2</text><text x="479" y="101">12</text>
      <text x="521" y="101">13</text><text x="563" y="101">14</text><text x="605" y="101">15</text><text x="647" y="101">16</text>
    </g>
  </g>

  <path d="M770 150H905" class="read-arrow"/>
  <rect x="905" y="90" width="255" height="120" class="read"/>
  <text x="1032" y="132" class="t" font-size="25" font-weight="700" text-anchor="middle">dense read</text>
  <text x="1032" y="169" class="m" font-size="18" text-anchor="middle">all N streams contribute</text>

  <text x="35" y="286" class="m" font-size="20">SPARSE MUTATION · k = 4</text>
  <rect x="35" y="305" width="245" height="120" class="routed"/>
  <text x="157" y="346" class="t" font-size="22" font-weight="700" text-anchor="middle">active selection</text>
  <text x="157" y="381" class="m" font-size="17" text-anchor="middle">fixed-2 + routed Top-2</text>

  <path d="M280 365H330" class="mutate-arrow"/>
  <rect x="330" y="305" width="220" height="120" class="fixed"/>
  <text x="440" y="346" class="t" font-size="22" font-weight="700" text-anchor="middle">gather active</text>
  <text x="440" y="381" class="m" font-size="17" text-anchor="middle">[k,C] state</text>

  <path d="M550 365H600" class="mutate-arrow"/>
  <rect x="600" y="305" width="220" height="120" class="update"/>
  <text x="710" y="346" class="t" font-size="22" font-weight="700" text-anchor="middle">mix + write</text>
  <text x="710" y="381" class="m" font-size="17" text-anchor="middle">only active k streams</text>

  <path d="M820 365H870" class="mutate-arrow"/>
  <rect x="870" y="305" width="290" height="120" class="next"/>
  <text x="1015" y="346" class="t" font-size="22" font-weight="700" text-anchor="middle">scatter to full state</text>
  <text x="1015" y="381" class="m" font-size="17" text-anchor="middle">updated active + exact carry</text>

  <rect x="355" y="455" width="490" height="45" class="inactive"/>
  <text x="600" y="484" class="m" font-size="17" text-anchor="middle">inactive N−k streams · bypass mutation unchanged</text>
</svg>
