<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">四种 residual topology 的问题驱动演化</title>
  <desc id="desc">Standard PreNorm 分别通向 HC 与 AttnRes，HC 通向 mHC，mHC 通向 xHC。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1258ff"/></marker><style>.t{font-family:Inter,"PingFang SC",sans-serif;fill:#171816}.m{font-family:"SFMono-Regular",Consolas,monospace;fill:#565a55}.n{fill:#fffdf8;stroke:#171816;stroke-width:2}.b{fill:#e6edff;stroke:#1258ff;stroke-width:3}.g{fill:#e5f0e7;stroke:#3f7750;stroke-width:3}.w{fill:#fff3cf;stroke:#9a7611;stroke-width:3}.r{fill:#f7e6e1;stroke:#b44c35;stroke-width:3}.a{fill:none;stroke:#1258ff;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="500" fill="#fffdf8"/>
  <path d="M260 215L345 145" class="a"/>
  <path d="M565 120H660" class="a"/>
  <path d="M880 120H975" class="a"/>
  <path d="M260 275L345 355" class="a"/>
  <rect x="40" y="195" width="220" height="110" class="n"/><text x="150" y="237" class="t" font-size="26" text-anchor="middle" font-weight="700">Standard PreNorm</text><text x="150" y="275" class="m" font-size="20" text-anchor="middle">fixed single stream</text>
  <rect x="345" y="65" width="220" height="110" class="b"/><text x="455" y="107" class="t" font-size="28" text-anchor="middle" font-weight="700">HC / DHC</text><text x="455" y="145" class="m" font-size="20" text-anchor="middle">state capacity</text>
  <rect x="660" y="65" width="220" height="110" class="g"/><text x="770" y="107" class="t" font-size="28" text-anchor="middle" font-weight="700">mHC</text><text x="770" y="145" class="m" font-size="20" text-anchor="middle">product stability</text>
  <rect x="975" y="65" width="185" height="110" class="w"/><text x="1067" y="107" class="t" font-size="28" text-anchor="middle" font-weight="700">xHC</text><text x="1067" y="145" class="m" font-size="20" text-anchor="middle">large-N cost</text>
  <rect x="345" y="325" width="220" height="110" class="r"/><text x="455" y="367" class="t" font-size="28" text-anchor="middle" font-weight="700">AttnRes</text><text x="455" y="405" class="m" font-size="20" text-anchor="middle">source retrieval</text>
  <text x="900" y="390" class="t" font-size="23" text-anchor="middle">不是发表时间线</text><text x="900" y="425" class="m" font-size="18" text-anchor="middle">arrows = design pressure</text>
</svg>
